<!DOCTYPE html>

<head>

<style>
:root{
  --bg:#fbf8fd; --card:#ffffff; --ink:#3b3654; --muted:#7a7592; --line:#ece6f4;
  --navy:#6a5cc7; --blue:#8b7fe0; --sky:#efeafd; --gold:#e0a96d; --gold-soft:#fff1e3;
  --green:#3f9b73; --green-soft:#e2f6ec; --red:#d46a7e; --red-soft:#fde8ee; --amber:#c27c3e; --amber-soft:#fff3e6;
  --pink:#fde4ef; --mint:#dcf5ea; --peach:#ffe9dc; --lav:#ebe5ff; --sky2:#e0f0fc;
  --radius:18px; --shadow:0 1px 2px rgba(90,70,140,.05),0 6px 18px rgba(90,70,140,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
.ar{font-family:'Amiri',serif;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:16px 14px 80px}
header.top{background:linear-gradient(135deg,#e6dcff 0%,#fde2ef 50%,#d9f3e8 100%);color:#3b3654;border-radius:20px;padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
header.top:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,200,.9),transparent 70%)}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.top .sub{opacity:.85;font-size:13px;margin-top:2px}
.top .ar-title{font-size:24px;opacity:.95;margin-top:6px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.status{background:rgba(255,255,255,.7);color:#5a4fa8}
.btn-undo{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(106,92,199,.15);border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.btn-undo:disabled{opacity:.45;cursor:default}
.progress-hero{margin-top:14px;position:relative;z-index:1}
.bar{height:10px;background:rgba(255,255,255,.75);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#b9adf5,#f5a9c8,#9fdcbf);border-radius:99px;transition:width .4s}
.hero-nums{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px;opacity:.92}
nav.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 12px;padding-bottom:2px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--lav);border-color:#cfc4fa;color:#4b3fa0}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid #edf1f7}
.card h2{margin:0 0 4px;font-size:16px;font-weight:800}
.card h3{margin:14px 0 6px;font-size:14px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.daybar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.t-full{background:var(--green-soft);color:var(--green)}
.t-ringan{background:var(--sky);color:var(--blue)}
.t-murajaah{background:var(--gold-soft);color:var(--amber)}
.t-libur{background:#f1eef6;color:#7f7896}
.t-murajaah{background:var(--peach)}
.target{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#f3efff,#e4f4fd);border:1px solid #ddd5fb;border-radius:14px;padding:14px;margin:10px 0}
.target .nm{font-weight:800;font-size:17px}
.target .ar{font-size:30px;color:var(--navy);line-height:1}
.steps{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:13.5px}
.steps li{margin:2px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:14px}
.btn-primary{background:#cfc4fa;color:#3d3190}
.btn-green{background:#bfeed6;color:#1f6b49}
.btn-soft{background:var(--sky);color:var(--navy)}
.btn-ghost{background:transparent;color:var(--blue);padding:8px 6px}
.btn-red{background:var(--red-soft);color:var(--red)}
.btn-q{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-q[data-q=lancar]{background:var(--mint);border-color:#bfe8d4}.btn-q[data-q=salah]{background:var(--peach);border-color:#fad3bd}.btn-q[data-q=ulang]{background:var(--pink);border-color:#f7c6da}
.btn-q:hover{border-color:var(--blue)}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.done-box{background:var(--green-soft);color:#155f3f;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;margin:8px 0}
.info-box{background:var(--gold-soft);color:#7a5413;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{background:var(--sky2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.chip.flag{background:var(--red-soft);border-color:#f5c6c0;color:#8f2a1f}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#fff;border:1px solid rgba(255,255,255,.8);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.stat:nth-child(1){background:var(--lav)}.stat:nth-child(2){background:var(--mint)}.stat:nth-child(3){background:var(--pink)}.stat:nth-child(4){background:var(--peach)}
.stat b{display:block;font-size:19px;font-weight:800;color:var(--navy)}
.stat span{font-size:11.5px;color:var(--muted)}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.sur{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left;position:relative}
.sur:hover{border-color:var(--blue)}
.sur .no{font-size:11px;color:var(--muted);font-weight:700}
.sur .nm{font-weight:700;font-size:14px}
.sur .ar{font-size:20px;position:absolute;right:10px;top:6px;color:var(--navy)}
.sur .mini{height:6px;background:#eef2f8;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.sur .mini i{display:block;height:100%;background:var(--blue)}
.sur.hafal{border-color:#bfe8d4;background:#f2fbf6}
.sur.hafal .mini i{background:var(--green)}
.sur.mutqin{border-color:#f6d6b4;background:#fff6ec}
.sur.mutqin .mini i{background:var(--gold)}
.sur.now{box-shadow:0 0 0 3px #ddd3fd}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.weekrow{display:grid;grid-template-columns:78px 160px 1fr;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.weekrow:first-of-type{border-top:0}
.weekrow .dn{font-weight:800;padding-top:8px}
.weekrow .fields{display:grid;gap:6px}
@media(max-width:600px){.weekrow{grid-template-columns:1fr 1fr}.weekrow .dn{grid-column:1/-1;padding-top:0}.weekrow .fields{grid-column:1/-1}}
.plan-item{display:grid;grid-template-columns:150px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center;font-size:14px}
.plan-item:first-child{border-top:0}
.plan-item.today{background:var(--lav);border-radius:10px;padding:9px 8px}
.plan-item .d{color:var(--muted);font-size:13px}
.plan-wk{font-size:12px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px}
@media(max-width:600px){.plan-item{grid-template-columns:1fr auto}.plan-item .d{grid-column:1/-1}}
.log{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.log:first-child{border-top:0}
.log .body{flex:1}
.x{border:0;background:#f5f2fa;color:#8a93a5;width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px;flex:0 0 auto}
.x:hover{background:var(--red-soft);color:var(--red)}
.guide p,.guide li{font-size:14px}
.guide li{margin:4px 0}
.field{display:grid;gap:4px;margin:10px 0}
.field label{font-weight:700;font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{border:1.5px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:13.5px}
.seg input{display:none}
.seg input:checked+span{color:var(--navy);font-weight:800}
.seg label:has(input:checked){border-color:var(--navy);background:var(--sky)}
.modal-bg{position:fixed;inset:0;background:rgba(15,25,45,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:17px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#4b3f86;color:#fff;padding:10px 14px;border-radius:12px;font-size:13.5px;display:flex;gap:12px;align-items:center;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92vw}
.toast button{background:none;border:0;color:#ffd6e6;font-weight:800;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.congrats{text-align:center;padding:24px 12px}
.congrats .ar{font-size:30px;color:var(--gold)}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.seg2{display:flex;gap:6px;background:#f4f0fb;padding:4px;border-radius:14px;margin:10px 0}
.seg2 button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 6px;font-weight:700;color:var(--muted);cursor:pointer;font-size:13.5px}
.seg2 button.on{background:#fff;color:#4b3fa0;box-shadow:0 2px 6px rgba(106,92,199,.15)}
.dzc{position:relative;transition:background .3s}
.dzc.done{background:linear-gradient(135deg,#f0fbf5,#eaf7f0);border-color:#c9ecd9}
.dzc .dzt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dzc .dzt b{font-size:14.5px}
.dzc .q{font-size:25px;line-height:2;margin:8px 0 4px}
.dzc .lt{font-size:13.5px;font-style:italic;color:#6a6488;margin:4px 0}
.dzc .idt{font-size:13.5px;color:var(--muted);margin:4px 0}
.dzc details{font-size:12.5px;color:var(--muted);margin-top:6px}
.dzc summary{cursor:pointer;color:var(--blue);font-weight:600}
.cnt{display:flex;align-items:center;gap:10px;margin-top:10px}
.tap{flex:1;border:0;border-radius:14px;padding:12px;font-weight:800;font-size:15px;cursor:pointer;background:var(--lav);color:#4b3fa0;transition:transform .08s}
.tap:active{transform:scale(.97)}
.dzc.done .tap{background:#bfeed6;color:#1f6b49}
.minus{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);font-size:18px}
.dzbar{height:6px;background:#efeaf7;border-radius:99px;overflow:hidden;margin-top:8px}
.dzbar i{display:block;height:100%;background:linear-gradient(90deg,#b9adf5,#9fdcbf);transition:width .2s}
.shchips{display:flex;gap:6px;flex-wrap:wrap}
.shchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.shchip.on{background:var(--mint);border-color:#bfe8d4;color:#1f6b49}
.dzrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.dzpill{flex:1;min-width:120px;border:1.5px solid var(--line);border-radius:14px;padding:10px;background:#fff;cursor:pointer;text-align:left}
.dzpill.ok{background:var(--mint);border-color:#bfe8d4}
.dzpill b{display:block;font-size:14px}.dzpill span{font-size:12px;color:var(--muted)}
.q{font-family:'Amiri Quran','Amiri',serif;direction:rtl;font-size:27px;line-height:2.1;color:#2f2a4a}
.bsm{text-align:center;font-size:26px;margin:4px 0 10px;color:var(--navy)}
.ay{padding:12px 4px;border-top:1px dashed var(--line);position:relative}
.ay:first-of-type{border-top:0}
.ay.hl{background:linear-gradient(90deg,#fff4ea,#fdeaf3);border-radius:14px;padding:12px 10px;border-top-color:transparent}
.ay .tr{font-size:13.5px;color:var(--muted);margin-top:2px}
.ay .num{font-family:'Amiri',serif;color:var(--gold);font-size:22px;margin-right:4px}
.ay .an{position:absolute;left:4px;top:10px;font-size:11px;font-weight:800;color:#b3abd0}
.ay.hide .q{filter:blur(9px);cursor:pointer;user-select:none}
.ay.hide .tr{visibility:hidden}
.readbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.readbar select{width:auto}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;background:#fff}
.toggle.on{background:var(--mint);border-color:#bfe8d4;color:#1f6b49;font-weight:700}
.chip.link{cursor:pointer}.chip.link:hover{border-color:var(--blue)}
#player{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(860px,calc(100% - 20px));background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border:1px solid #e5ddf7;border-radius:18px;box-shadow:0 10px 30px rgba(90,70,140,.18);padding:10px 12px;z-index:40;display:none}
#player.show{display:block}
#player .pl-top{display:flex;align-items:center;gap:10px}
#player .pbtn{width:44px;height:44px;border-radius:50%;border:0;background:#cfc4fa;color:#3d3190;font-size:18px;cursor:pointer;flex:0 0 auto}
#player .ttl{flex:1;min-width:0}
#player .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player input[type=range]{width:100%;accent-color:#8b7fe0;margin:6px 0 0}
#player .pl-opts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
#player .pl-opts select{width:auto;padding:4px 6px;font-size:12.5px}
#player .xbtn{border:0;background:#f5f2fa;border-radius:9px;width:30px;height:30px;cursor:pointer;color:#8a83a5}
body.has-player .wrap{padding-bottom:150px}
#player .pl-top{flex-wrap:wrap}
@media(max-width:600px){#player .pl-opts{order:4;flex-basis:100%;justify-content:flex-start}#player .ttl{flex:1 1 120px}}
.ibscore{display:flex;align-items:center;gap:14px}
.ring{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.ring b{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:17px;color:#4b3fa0}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 4px}
.datenav button{border:1.5px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px}
.datenav button:disabled{opacity:.35}
.fardhu{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.fb{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 2px;cursor:pointer;text-align:center;font-weight:700;font-size:12.5px}
.fb i{display:block;font-style:normal;font-size:19px;height:24px}
.fb.s1{background:var(--mint);border-color:#bfe8d4;color:#1f6b49}
.fb.s2{background:#fff1d9;border-color:#f6d6a8;color:#9a6a1c}
.ibrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ibrow:first-of-type{border-top:0}
.ibrow .nm{font-weight:600;font-size:14px}
.ibrow .sub{font-size:12px;color:var(--muted)}
.tg{min-width:44px;height:36px;border-radius:11px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:16px;font-weight:800;color:#c9c2dc}
.tg.on{background:var(--mint);border-color:#bfe8d4;color:#1f6b49}
.tg.auto{min-width:auto;padding:0 10px;font-size:12.5px}
.ibnum{width:86px!important;text-align:center}
.wk{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px}

.wk td.na{background:transparent;color:#cfc9de}
.wk td.lbl{text-align:left;background:transparent;font-weight:600;color:var(--ink);padding-right:4px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.cal button{aspect-ratio:1;border:0;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;color:#4b4566;position:relative}
.cal button.td{outline:2px solid #8b7fe0}
.cal button small{position:absolute;bottom:2px;left:0;right:0;font-size:9px}
.ibbar{display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.ibbar .bb{height:8px;background:#efeaf7;border-radius:99px;overflow:hidden;margin-top:3px}
.ibbar .bb i{display:block;height:100%;background:linear-gradient(90deg,#b9adf5,#9fdcbf)}

<body>
<div class="wrap">
  <header class="top">
    <div class="toprow">
      <div>
        <h1>Program Hafalan Juz 30</h1>
        <div class="sub">Jadwal personal Devy · menyesuaikan mengajar, kuliah, tahsin & olahraga</div>
      </div>
      <div class="tools">
        <span class="pill status" id="status">Memuat…</span>
        <button class="btn-undo" id="undoBtn" title="Batalkan perubahan terakhir">↶ Undo</button>
      </div>
    </div>
    <div class="progress-hero">
      <div class="bar"><i id="heroBar" style="width:0"></i></div>
      <div class="hero-nums"><span id="heroL"></span><span id="heroR"></span></div>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="player"><div class="pl-top"><button class="pbtn" id="plPlay">▶</button><div class="ttl"><b id="plTitle">—</b><span class="small muted" id="plTime">0:00 / 0:00</span></div>
<div class="pl-opts"><label>Ulang <select id="plRep"><option value="1">1×</option><option value="3">3×</option><option value="5">5×</option><option value="10">10×</option><option value="0">terus</option></select></label>
<label>Kecepatan <select id="plSpd"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label></div>
<button class="xbtn" id="plClose" title="Tutup pemutar">✕</button></div><input type="range" id="plSeek" min="0" max="1000" value="0"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ===== Data Juz 30 ===== */
const SURAH=[

/* ===== Tanggal ===== */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayStr=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmt=(s,day=true)=>{const d=parse(s);return (day?HARI[d.getDay()]+', ':'')+d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear()};
const fmtShort=s=>{const d=parse(s);return HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()].slice(0,3)};
const dayNum=s=>Math.round(parse(s).getTime()/864e5);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== State ===== */
function defaultState(){return{
  v:1,
  settings:{target:4,order:'nas',startDate:todayStr()},
  week:{
    1:{type:'full',time:"Ba'da Subuh, ±20 menit",note:'Hari paling longgar — porsi hafalan baru penuh'},
    2:{type:'ringan',time:"Ba'da Subuh, ±10–15 menit",note:'Hari mengajar — setengah porsi, ulang di shalat Dhuha/Zhuhur'},
    3:{type:'ringan',time:"Ba'da Subuh, ±10–15 menit",note:'Hari mengajar — setengah porsi'},
    4:{type:'ringan',time:"Ba'da Subuh, ±10–15 menit",note:'Hari mengajar — setengah porsi'},
    5:{type:'murajaah',time:"Ba'da Subuh, ±10 menit",note:'Hari kuliah — cukup murajaah; dengarkan murattal di perjalanan ke kampus'},
    6:{type:'libur',time:'—',note:'Kuliah sampai sore — istirahat; cukup baca hafalan dalam shalat'},
    0:{type:'murajaah',time:'Setelah tahsin, ±06.30',note:'Murajaah pekanan + minta ustadzah tahsin menyimak bacaan'}
  },
  progress:{},log:[],dz:{date:'',pagi:{},petang:{},salah:{}},dzLog:{},updatedAt:0
}}
function normalize(s){
  const d=defaultState();
  s=s&&typeof s==='object'?s:{};
  s.settings=Object.assign({},d.settings,s.settings||{});
  s.week=s.week||{};for(let i=0;i<7;i++){s.week[i]=Object.assign({},d.week[i],s.week[i]||{})}
  s.progress=s.progress||{};s.ib=Object.assign({days:{},off:[],custom:[]},s.ib||{});s.dz=Object.assign({date:'',pagi:{},petang:{},salah:{}},s.dz||{});s.dzLog=s.dzLog||{};s.log=Array.isArray(s.log)?s.log:[];s.updatedAt=s.updatedAt||0;s.v=1;
  return s;
}
const LS='hafalan-juz30-devy-v1';
let localOK=true,state;
try{state=normalize(JSON.parse(localStorage.getItem(LS)||'null'))}catch(e){localOK=false;state=normalize(null)}

const P=no=>state.progress[no]||{done:0,mutqin:false,flag:false};
const setP=(no,obj)=>{state.progress[no]=Object.assign({done:0,mutqin:false,flag:false},state.progress[no]||{},obj)};
const orderList=()=>{const a=SURAH.map(s=>s[0]);return state.settings.order==='nas'?a.reverse():a};
const current=()=>orderList().find(no=>P(no).done<BY[no].n);
const totalDone=()=>SURAH.reduce((a,s)=>a+Math.min(P(s[0]).done,s[3]),0);
const finishedList=()=>orderList().filter(no=>P(no).done>=BY[no].n);
const weekOf=s=>state.week[parse(s).getDay()];
function amountFor(s){
  const t=+state.settings.target||1, w=weekOf(s);
  if(s<state.settings.startDate)return 0;
  return w.type==='full'?t:w.type==='ringan'?Math.max(1,Math.ceil(t/2)):0;
}
const logsOn=(d,type)=>state.log.filter(e=>e.date===d&&(!type||e.type===type));

/* ===== Simulasi rencana ===== */
function simulate(limit=2500){
  const ol=orderList(),prog={};ol.forEach(no=>prog[no]=P(no).done);
  const t=+state.settings.target||1;
  const weekly=[0,1,2,3,4,5,6].reduce((a,i)=>{const w=state.week[i];return a+(w.type==='full'?t:w.type==='ringan'?Math.max(1,Math.ceil(t/2)):0)},0);
  if(weekly===0)return{sessions:[],end:null,weekly:0};
  let d=todayStr(); if(d<state.settings.startDate)d=state.settings.startDate;
  if(d===todayStr()&&logsOn(d,'ziyadah').length)d=addDays(d,1);
  const out=[];
  for(let i=0;i<limit;i++){
    const cur=ol.find(no=>prog[no]<BY[no].n); if(!cur)break;
    const a=amountFor(d);
    if(a>0){const from=prog[cur]+1,to=Math.min(BY[cur].n,prog[cur]+a);prog[cur]=to;out.push({date:d,surah:cur,from,to})}
    d=addDays(d,1);
  }
  return{sessions:out,end:out.length?out[out.length-1].date:null,weekly};
}

/* ===== Rencana murajaah ===== */
function murajaahPlan(s){
  const fin=finishedList(), cur=current();
  const flagged=orderList().filter(no=>P(no).flag&&P(no).done>0).map(no=>({no,from:1,to:P(no).done}));
  const fset=new Set(flagged.map(x=>x.no));
  const dekat=[];
  if(cur&&P(cur).done>0&&!fset.has(cur))dekat.push({no:cur,from:1,to:P(cur).done});
  fin.slice(-2).reverse().forEach(no=>{if(!fset.has(no))dekat.push({no,from:1,to:BY[no].n})});
  const dset=new Set(dekat.map(x=>x.no));
  const rest=fin.filter(no=>!dset.has(no)&&!fset.has(no));
  const size=weekOf(s).type==='murajaah'?45:20;
  const chunks=[];let c=[],sum=0;
  rest.forEach(no=>{c.push({no,from:1,to:BY[no].n});sum+=BY[no].n;if(sum>=size){chunks.push(c);c=[];sum=0}});
  if(c.length)chunks.push(c);
  const jauh=chunks.length?chunks[((dayNum(s)%chunks.length)+chunks.length)%chunks.length]:[];
  return{flagged,dekat,jauh,chunks:chunks.length};
}
const lbl=x=>'QS. '+BY[x.no].name+(x.from===1&&x.to===BY[x.no].n?'':' '+x.from+'–'+x.to);

function streak(){
  let d=todayStr(),n=0;
  if(!state.log.some(e=>e.date===d))d=addDays(d,-1);
  for(let i=0;i<800;i++){
    if(state.log.some(e=>e.date===d)){n++}
    else if(weekOf(d).type!=='libur'||d<state.settings.startDate){break}
    d=addDays(d,-1);
  }
  return n;
}

/* ===== Simpan (otomatis), Sinkron GitHub Gist & Undo ===== */
let saveTimer=null,pushing=false,again=false;
const hist=[];
const GKEY=LS+'-gh',GFILE='hafalan-juz30-devy.json';
let gh={token:'',id:'',last:0};try{gh=Object.assign(gh,JSON.parse(localStorage.getItem(GKEY)||'{}'))}catch(e){}
const saveGh=()=>{try{localStorage.setItem(GKEY,JSON.stringify(gh))}catch(e){}};
function snap(){hist.push(JSON.stringify(state));if(hist.length>50)hist.shift();updUndo()}
function updUndo(){document.getElementById('undoBtn').disabled=!hist.length}
function setStatus(k){
  const m={saving:'● Menyimpan…',synced:'✓ Tersinkron',local:'✓ Tersimpan di perangkat ini',offline:'⚠ Offline — tersimpan di perangkat',err:'⚠ Sinkron gagal — tersimpan di perangkat',mem:'⚠ Penyimpanan tidak tersedia'};
  document.getElementById('status').textContent=m[k]||k;
}
function persist(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(gh.token&&gh.id){setStatus('saving');clearTimeout(saveTimer);saveTimer=setTimeout(push,2500)}
  else setStatus(localOK?'local':'mem');
}
function undo(){
  if(!hist.length)return;
  state=normalize(JSON.parse(hist.pop()));updUndo();persist();render();toast('Perubahan terakhir dibatalkan');
}
async function api(path,opt){
  const r=await fetch('https://api.github.com'+path,Object.assign({headers:{'Authorization':'Bearer '+gh.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'}},opt||{}));
  if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e}
  return r.json();
}
async function readGist(){
  const g=await api('/gists/'+gh.id);const f=g.files&&g.files[GFILE];if(!f)return null;
  let txt=f.content;if(f.truncated){txt=await (await fetch(f.raw_url)).text()}
  try{return JSON.parse(txt)}catch(e){return null}
}
async function push(){
  if(!gh.token||!gh.id)return;
  if(!navigator.onLine){setStatus('offline');return}
  if(pushing){again=true;return}
  pushing=true;
  try{await api('/gists/'+gh.id,{method:'PATCH',body:JSON.stringify({files:{[GFILE]:{content:JSON.stringify(state)}}})});gh.last=Date.now();saveGh();setStatus('synced')}
  catch(e){setStatus(e.status===401?'err':navigator.onLine?'err':'offline');if(e.status===401)toast('Token GitHub tidak berlaku lagi. Sambungkan ulang di tab Jadwal & Atur.')}
  pushing=false;if(again){again=false;push()}
}
async function pull(){
  if(!gh.token||!gh.id||!navigator.onLine){setStatus(gh.token?'offline':(localOK?'local':'mem'));return}
  try{
    const remote=await readGist();
    if(remote&&(remote.updatedAt||0)>(state.updatedAt||0)){state=normalize(remote);try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){};render();toast('Data terbaru dari perangkat lain sudah dimuat')}
    else if(!remote||(state.updatedAt||0)>(remote.updatedAt||0)){await push();return}
    setStatus('synced');
  }catch(e){setStatus(e.status===404?'err':'offline');if(e.status===404){gh.id='';saveGh()}}
}
async function connectGh(token){
  gh.token=token.trim();gh.id='';
  setStatus('saving');
  try{
    await api('/user');
    let page=1,found=null;
    while(page<=5&&!found){const list=await api('/gists?per_page=100&page='+page);found=list.find(g=>g.files&&g.files[GFILE]);if(list.length<100)break;page++}
    if(found){gh.id=found.id;saveGh();await pull();toast('Tersambung ✓ Data disinkronkan')}
    else{const g=await api('/gists',{method:'POST',body:JSON.stringify({description:'Data aplikasi Program Hafalan Juz 30 (jangan dihapus)',public:false,files:{[GFILE]:{content:JSON.stringify(state)}}})});gh.id=g.id;saveGh();setStatus('synced');toast('Tersambung ✓ Penyimpanan sinkron dibuat')}
    render();return true;
  }catch(e){gh.token='';gh.id='';saveGh();setStatus(localOK?'local':'mem');toast(e.status===401?'Token tidak valid. Cek lagi ya.':e.status===403||e.status===404?'Token belum punya izin “gist”.':'Gagal tersambung. Cek internet lalu coba lagi.');return false}
}
function disconnectGh(){gh={token:'',id:'',last:0};saveGh();setStatus(localOK?'local':'mem');render();toast('Sinkron diputus. Data tetap ada di perangkat ini.')}
function initSync(){
  if(gh.token&&gh.id)pull();else setStatus(localOK?'local':'mem');
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull();else if(gh.token&&gh.id&&saveTimer){clearTimeout(saveTimer);push()}});
  window.addEventListener('online',()=>pull());
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cadangan-hafalan-'+todayStr()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);

function importData(file){

}

/* ===== Aksi ===== */
function doZiyadah(amount,note){
  const cur=current(); if(!cur){toast('MasyaAllah, semua surah sudah hafal!');return}
  snap();
  const p=P(cur),from=p.done+1,to=Math.min(BY[cur].n,p.done+Math.max(1,amount));
  setP(cur,{done:to});
  state.log.push({id:'z'+Date.now(),date:todayStr(),ts:Date.now(),type:'ziyadah',surah:cur,from,to,note:note||''});
  persist();render();
  toast(to>=BY[cur].n?'Alhamdulillah, QS. '+BY[cur].name+' selesai dihafal! 🎉':'Tercatat: QS. '+BY[cur].name+' ayat '+from+'–'+to,true);
}
function doMurajaah(q,note){
  const m=murajaahPlan(todayStr());const items=[...m.flagged,...m.dekat,...m.jauh];
  snap();
  const nos=[...new Set(items.map(x=>x.no))];
  if(q==='lancar')nos.forEach(no=>{if(P(no).flag)setP(no,{flag:false})});
  if(q==='ulang')nos.forEach(no=>setP(no,{flag:true}));
  state.log.push({id:'m'+Date.now(),date:todayStr(),ts:Date.now(),type:'murajaah',items:items.map(lbl),quality:q,note:note||''});
  persist();render();toast('Murajaah dicatat: '+QUAL[q],true);
}
function delLog(id){
  const e=state.log.find(x=>x.id===id); if(!e)return;
  confirmBox('Hapus catatan ini?',e.type==='ziyadah'?'Progres hafalan QS. '+BY[e.surah].name+' akan dikembalikan ke sebelum sesi ini.':'Catatan murajaah akan dihapus.',()=>{
    snap();
    if(e.type==='ziyadah'&&P(e.surah).done===e.to)setP(e.surah,{done:e.from-1,mutqin:false});
    state.log=state.log.filter(x=>x.id!==id);persist();render();toast('Catatan dihapus',true);
  });
}

 {id:'rawatib',g:'Shalat Sunnah',n:'Rawatib',haidOff:1},
 {id:'dhuha',g:'Shalat Sunnah',n:'Dhuha',haidOff:1},

 {id:'ziyadah',g:"Al-Qur'an",n:'Hafalan baru',auto:'ziyadah'},
 {id:'murajaah',g:"Al-Qur'an",n:'Murajaah',auto:'murajaah'},
 {id:'tahsin',g:"Al-Qur'an",n:'Kelas tahsin',days:[0],sub:'khusus Ahad'},
 {id:'dzpagi',g:'Dzikir',n:'Dzikir pagi',auto:'pagi'},
 {id:'dzpetang',g:'Dzikir',n:'Dzikir petang',auto:'petang'},

];

const ibDay=d=>state.ib.days[d]||{};
function ibSet(d,obj){state.ib.days[d]=Object.assign({},state.ib.days[d]||{},obj)}
function ibActive(d,it){const D=ibDay(d);if(it.days&&!it.days.includes(parse(d).getDay()))return false;if(D.haid&&it.haidOff)return false;return true}
function ibVal(d,it){
  const D=ibDay(d),k=D.k||{};
  if(it.auto==='ziyadah'||it.auto==='murajaah')return state.log.some(e=>e.date===d&&e.type===it.auto)?1:0;
  if(it.auto==='pagi'||it.auto==='petang')return (state.dzLog[d]||{})[it.auto]?1:0;
  if(it.auto==='salah')return Math.min(1,((state.dzLog[d]||{}).shalat||[]).length/5);
  if(it.num)return +k[it.id]>0?1:0;
  return k[it.id]?1:0;
}
function ibScore(d){const D=ibDay(d);let tot=0,got=0;
  if(!D.haid){tot+=5;got+=FARDHU.filter(f=>(D.s||{})[f]).length}
  ibItems().forEach(it=>{if(ibActive(d,it)){tot++;got+=ibVal(d,it)}});return tot?got/tot:0}
function ibFirst(){const c=[...Object.keys(state.ib.days),...state.log.map(e=>e.date),...Object.keys(state.dzLog)].sort();return c[0]||todayStr()}
const pct=x=>Math.round(x*100)+'%';

  else h+='<div class="fardhu">'+FARDHU.map(f=>{const v=(D.s||{})[f]||0;return '<button class="fb s'+v+'" data-act="ibf" data-f="'+f+'"><i>'+(v===2?'⭐':v===1?'✓':'')+'</i>'+f+'</button>'}).join('')+'</div><div class="hint">Ketuk sekali: ✓ dikerjakan · dua kali: ⭐ di awal waktu · tiga kali: hapus</div>';
  h+='</div>';
  const groups={};ibItems().forEach(it=>{(groups[it.g]=groups[it.g]||[]).push(it)});

}
function bonusModal(){
  const cur=current();if(!cur)return;const p=P(cur),rem=BY[cur].n-p.done;
  openModal('<h3>Tambah hafalan baru</h3><p class="muted small" style="margin-top:0">QS. '+BY[cur].name+' mulai ayat '+(p.done+1)+' (sisa '+rem+' ayat)</p>'+
    '<div class="field"><label>Berapa ayat yang sudah hafal?</label><input type="number" id="bN" min="1" max="'+rem+'" value="'+Math.min(rem,Math.max(1,amountFor(todayStr())||Math.ceil(state.settings.target/2)))+'"></div>'+
    '<div class="field"><input type="text" id="bNote" placeholder="Catatan (opsional)"></div>'+
    '<div class="row" style="justify-content:flex-end"><button class="btn btn-soft" data-act="close">Batal</button><button class="btn btn-green" data-act="bsave">✓ Catat</button></div>');
}

/* ===== Events ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;try{localStorage.setItem(LS+'-tab',tab)}catch(x){}render();window.scrollTo({top:0,behavior:'smooth'});return}
  const a=t.dataset.act;
  if(a==='closebg'){if(e.target===t)closeModal();return}
  if(a==='close'){closeModal();return}
  if(a==='undo'){undo();document.getElementById('toastRoot').innerHTML='';return}
  if(a==='ziyadah'){const n=document.getElementById('zNote');doZiyadah(+t.dataset.amt,n?n.value.trim():'');return}
  if(a==='bonus'){bonusModal();return}
  if(a==='bsave'){const n=+document.getElementById('bN').value;if(!(n>0)){toast('Isi jumlah ayat dulu ya');return}const note=document.getElementById('bNote').value.trim();closeModal();doZiyadah(n,note);return}
  if(a==='murajaah'){const n=document.getElementById('mNote');doMurajaah(t.dataset.q,n?n.value.trim():'');return}
  if(a==='mshow'){const old=state.log.filter(x=>x.date===todayStr()&&x.type==='murajaah');openModal('<h3>Catat murajaah lagi</h3><div class="field"><input type="text" id="mNote" placeholder="Catatan (opsional)"></div><div class="row">'+Object.keys(QUAL).map(k=>'<button class="btn btn-q" data-act="murajaah2" data-q="'+k+'">'+QUAL[k]+'</button>').join('')+'</div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn btn-soft" data-act="close">Tutup</button></div>');return}
  if(a==='murajaah2'){const n=document.getElementById('mNote');const v=n?n.value.trim():'';closeModal();doMurajaah(t.dataset.q,v);return}
  if(a==='dellog'){delLog(t.dataset.id);return}
  if(a==='ibmode'){ibMode=t.dataset.m;render();return}
  if(a==='ibnav'){ibDate=addDays(ibDate||todayStr(),+t.dataset.n);if(ibDate>todayStr())ibDate=todayStr();render();return}
  if(a==='ibmon'){const x=parse(ibDate||todayStr());const d=new Date(x.getFullYear(),x.getMonth()+(+t.dataset.n),1);ibDate=ymd(d)>todayStr()?todayStr():ymd(d);render();return}
  if(a==='ibtoday'){ibDate=todayStr();render();return}
  if(a==='ibday'){ibDate=t.dataset.d;ibMode='hari';render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(a==='ibf'){snap();const D=ibDay(ibDate),s2=Object.assign({},D.s||{}),v=((s2[t.dataset.f]||0)+1)%3;if(v)s2[t.dataset.f]=v;else delete s2[t.dataset.f];ibSet(ibDate,{s:s2});persist();render();return}
  if(a==='ibk'){snap();const k=Object.assign({},ibDay(ibDate).k||{});if(k[t.dataset.id])delete k[t.dataset.id];else k[t.dataset.id]=1;ibSet(ibDate,{k});persist();render();return}
  if(a==='ibhaid'){snap();ibSet(ibDate,{haid:!ibDay(ibDate).haid});persist();render();return}
  if(a==='ibgo'){const to=t.dataset.to;if(to==='ziyadah'||to==='murajaah'){tab='today'}else{tab='dzikir';dzSess=to}try{localStorage.setItem(LS+'-tab',tab)}catch(x){}render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(a==='ibset'){ibSettings();return}
  if(a==='ibadd'){const v=(document.getElementById('ibNew').value||'').trim();if(!v)return;snap();state.ib.custom=[...(state.ib.custom||[]),{id:'c'+Date.now(),n:v}];persist();ibSettings();render();return}
  if(a==='ibdel'){e.preventDefault();const id=t.dataset.id;snap();state.ib.custom=(state.ib.custom||[]).filter(c=>c.id!==id);state.ib.off=(state.ib.off||[]).filter(x=>x!==id);persist();ibSettings();render();toast('Ibadah tambahan dihapus',true);return}
  if(a==='opentab'){tab=t.dataset.t;try{localStorage.setItem(LS+'-tab',tab)}catch(x){}render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(a==='ghon'){const v=(document.getElementById('ghTok')||{}).value||'';if(v.trim().length<20){toast('Tempel token GitHub dulu ya');return}connectGh(v);return}
  if(a==='ghoff'){confirmBox('Putuskan sinkron?','Data tetap tersimpan di perangkat ini dan di GitHub. Perangkat ini tidak akan ikut tersinkron sampai disambungkan lagi.',disconnectGh);return}
  if(a==='ghpull'){pull();return}
  if(a==='exp'){exportData();return}
  if(a==='paste'){openModal('<h3>Pindahkan data</h3><p class="small muted" style="margin-top:0">Di aplikasi versi Claude, buka <b>Jadwal & Atur</b> lalu ketuk <b>📋 Salin data</b>. Kemudian tempel di sini.</p><textarea id="pasteBox" rows="6" placeholder="Tempel data di sini"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn btn-soft" data-act="close">Batal</button><button class="btn btn-primary" data-act="pasteok">Pulihkan</button></div>');return}
  if(a==='pasteok'){try{const d=JSON.parse(document.getElementById('pasteBox').value);if(!d||!d.settings||!d.progress)throw 0;snap();state=normalize(d);closeModal();persist();render();toast('Data berhasil dipindahkan ✓',true)}catch(x){toast('Data tidak dikenali. Pastikan tersalin utuh.')}return}
  if(a==='opendz'){dzSess=t.dataset.s;tab='dzikir';try{localStorage.setItem(LS+'-tab',tab)}catch(x){}render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(a==='dzsess'){dzSess=t.dataset.s;render();return}
  if(a==='dztg'){const k=t.dataset.k;state.settings[k]=k==='dzTr'?state.settings.dzTr===false:!state.settings.dzLt;persist();render();return}
  if(a==='dztap'||a==='dzminus'){const ss=dzSess||defaultSess(),i=+t.dataset.i,c=dzCounts()[ss],n=nOf(ss,i);c[i]=Math.max(0,Math.min(n,(c[i]||0)+(a==='dztap'?1:-1)));persist();if(navigator.vibrate&&a==='dztap')try{navigator.vibrate(15)}catch(x){};dzUpdate(ss,i);return}
  if(a==='dzopt'){const ss=dzSess||defaultSess(),x=DZ[ss][+t.dataset.i];state.settings.dzOpt=Object.assign({},state.settings.dzOpt||{},{[ss+'-'+x.t]:+t.dataset.v});persist();render();return}
  if(a==='dzreset'){const ss=dzSess||defaultSess();snap();dzCounts()[ss]={};persist();render();toast('Hitungan diulang dari awal',true);return}
  if(a==='dzdone'){const ss=dzSess||defaultSess();snap();dzSetLog(ss,true);persist();render();toast(DZNAME[ss]+' ditandai selesai',true);return}
  if(a==='dzshalat'){const n=t.dataset.n,L=dzLogToday(),sh=[...(L.shalat||[])];snap();const was=sh.includes(n);
    if(sh.includes(n)){dzSetLog('shalat',sh.filter(x=>x!==n))}else{sh.push(n);dzSetLog('shalat',SHALAT.filter(x=>sh.includes(x)));dzCounts().salah={}}
    persist();render();toast(!was?'Dzikir setelah '+n+' dicatat':'Tanda '+n+' dibatalkan',true);return}
  if(a==='openread'){readNo=+t.dataset.no;hl={no:readNo,from:+t.dataset.from,to:+t.dataset.to};tab='baca';try{localStorage.setItem(LS+'-tab',tab)}catch(x){}render();setTimeout(()=>{const el=document.getElementById('ay'+hl.from);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},250);return}
  if(a==='play'){playSurah(+t.dataset.no);return}
  if(a==='tgTr'){state.settings.showTr=state.settings.showTr===false;persist();render();return}
  if(a==='tgHide'){state.settings.hideMode=!state.settings.hideMode;persist();render();return}
  if(a==='reveal'){if(state.settings.hideMode)t.classList.toggle('hide');return}
  if(a==='confirmok'){const cb=confirmCb;confirmCb=null;closeModal();cb&&cb();return}
  if(a==='editsur'){editSurah(+t.dataset.no);return}
  if(a==='efill'){document.getElementById('eDone').value=t.dataset.v;return}
  if(a==='esave'){
    const no=+t.dataset.no,s=BY[no];let v=Math.round(+document.getElementById('eDone').value);if(isNaN(v))v=0;v=Math.max(0,Math.min(s.n,v));
    const mut=document.getElementById('eMut').checked&&v>=s.n,fl=document.getElementById('eFlag').checked;
    const p=P(no);if(p.done!==v||!!p.mutqin!==mut||!!p.flag!==fl){snap();setP(no,{done:v,mutqin:mut,flag:fl});persist()}
    closeModal();render();toast('QS. '+s.name+' diperbarui',true);return}
  if(a==='toggleall'){showAll=!showAll;render();return}
  if(a==='reset'){confirmBox('Hapus semua data?','Progres, riwayat, dan pola pekanan kembali ke awal. Masih bisa dibatalkan dengan Undo selama halaman ini belum ditutup.',()=>{snap();const keep=state.updatedAt;state=normalize(null);persist();render();toast('Program dimulai ulang',true)});return}
});
document.getElementById('undoBtn').addEventListener('click',undo);
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.iboff){snap();const id=e.target.dataset.iboff;let off=(state.ib.off||[]).filter(x=>x!==id);if(!e.target.checked)off.push(id);state.ib.off=off;persist();render();return}if(e.target.id==='impFile'&&e.target.files[0]){importData(e.target.files[0]);e.target.value='';return}if(e.target.id==='readSel'){readNo=+e.target.value;render();window.scrollTo({top:0,behavior:'smooth'})}});

// Isian jadwal & pengaturan: simpan otomatis
let editSnapTaken=false;
document.addEventListener('focusin',e=>{if(e.target.matches('[data-wk],[data-set],[data-ibnum],[data-ibnote]')&&!editSnapTaken){snap();editSnapTaken=true}});
document.addEventListener('focusout',e=>{if(e.target.matches('[data-wk],[data-set],[data-ibnum],[data-ibnote]'))editSnapTaken=false});
let typeT;
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.ibnum){const k=Object.assign({},ibDay(ibDate).k||{});const v=Math.max(0,+el.value||0);if(v)k[el.dataset.ibnum]=v;else delete k[el.dataset.ibnum];ibSet(ibDate,{k});persist();ibRefreshScore();return}
  if(el.dataset.ibnote){ibSet(ibDate,{note:el.value});persist();return}
  if(el.dataset.wk!==undefined){state.week[el.dataset.wk][el.dataset.f]=el.value;persist();if(el.tagName==='SELECT')render();return}
  if(el.dataset.set){
    if(!editSnapTaken){snap()}
    const k=el.dataset.set;
    if(k==='target')state.settings.target=+el.value;
    else if(k==='order')state.settings.order=el.value;
    else if(k==='startDate'){if(!el.value)return;state.settings.startDate=el.value}
    persist();clearTimeout(typeT);typeT=setTimeout(render,k==='startDate'?500:0);
  }
});

render();
setStatus(localOK?'local':'mem');
initSync();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
